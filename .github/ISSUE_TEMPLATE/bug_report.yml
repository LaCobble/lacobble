name: Broken graphic or link
description: Something on the profile renders wrong or points nowhere.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What is wrong
      description: Which graphic or link, what you see and what you expected.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Browser / client
      placeholder: "Safari 26, GitHub mobile app, dark mode…"
